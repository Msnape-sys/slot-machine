<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win Big Slot Machine</title>
</head>
<body>
   

<header><h1>The Laughing Jaguar</h1></header>
<main>
<section class="gameInfo">
    <section id="balance">Balance: $<span id="total">100</span></section>
    <section id="bet"></section>
    <section id="winnings"></section>
</section>
<section class="reels"> 
    <section id="reel1"></section>
    <section id="reel2"></section>
    <section id="reel3"></section>
</section>
<section class="controls">
    <button id="minBet">Bet $5</button>
    <button id="spin">Spin</button>
    <button id="maxBet">Bet $50</button>
</section>
<section class="result"><p id="result"></p></section>
</main>
<script src="js/main.js"></script>
</body>
</html>
